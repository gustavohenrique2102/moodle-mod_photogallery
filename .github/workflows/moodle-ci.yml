name: Moodle Plugin CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} - ${{ matrix.database }}
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false

      matrix:
        include:
          - php: "8.3"
            moodle-branch: MOODLE_502_STABLE
            database: mariadb

          - php: "8.4"
            moodle-branch: MOODLE_502_STABLE
            database: mariadb

          - php: "8.3"
            moodle-branch: MOODLE_502_STABLE
            database: pgsql

          - php: "8.4"
            moodle-branch: MOODLE_502_STABLE
            database: pgsql

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mariadb:
        image: mariadb:10.11

        env:
          MYSQL_USER: root
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        with:
          path: plugin
          persist-credentials: false

      - name: Configurar PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2

        with:
          php-version: ${{ matrix.php }}
          extensions: >
            curl,
            gd,
            intl,
            mbstring,
            mysqli,
            pgsql,
            pdo_mysql,
            pdo_pgsql,
            soap,
            sodium,
            xml,
            zip
          ini-values: max_input_vars=5000
          coverage: none

      - name: Instalar Moodle Plugin CI
        run: |
          composer create-project \
            -n \
            --no-dev \
            --prefer-dist \
            moodlehq/moodle-plugin-ci \
            ci \
            4.5.11

          echo "$(cd ci/bin && pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin && pwd)" >> "$GITHUB_PATH"

          sudo locale-gen en_AU.UTF-8

          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"

      - name: Preparar Moodle de testes
        run: |
          moodle-plugin-ci install \
            --plugin ./plugin \
            --db-host=127.0.0.1

        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: Validar pacote de distribuição
        run: |
          git -C plugin archive \
            --format=zip \
            --prefix=photogallery/ \
            HEAD \
            --output=../photogallery.zip

          if unzip -Z1 photogallery.zip \
            | grep -E '(^|/)\.(git|svn|hg)(/|$)'; then
              echo "O pacote contém metadados de controle de versão."
              exit 1
          fi

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validar estrutura do plugin
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Verificar upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit

      - name: Marcar cancelamento como falha
        if: ${{ cancelled() }}
        run: exit 1
