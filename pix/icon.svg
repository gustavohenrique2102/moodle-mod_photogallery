<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 24 24"
     role="img"
     aria-labelledby="title">
    <title id="title">Galeria de fotos</title>

    <g fill="none"
       stroke="#ffffff"
       stroke-width="1.8"
       stroke-linecap="round"
       stroke-linejoin="round">

        <!-- Foto principal do mosaico. -->
        <rect x="2.5" y="3" width="12.5" height="18" rx="2"/>

        <!-- Fotos menores do mosaico. -->
        <rect x="16.5" y="3" width="5" height="8" rx="1.2"/>
        <rect x="16.5" y="13" width="5" height="8" rx="1.2"/>

        <!-- Elementos visuais da foto principal. -->
        <circle cx="6.2" cy="7" r="1"/>
        <path d="M4.5 17.5l3.2-4 2.2 2.4 1.5-1.8 2.1 3.4"/>

        <!-- Elementos visuais das miniaturas. -->
